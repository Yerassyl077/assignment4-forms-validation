<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Contact Form</h2>

    <form id="contactForm" novalidate>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Name is required.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Please enter a valid email.</div>
            </div>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Write your message" required></textarea>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Message is required.</div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <p id="result" class="mt-3 text-success"></p>
    </form>
</div>

<script>
    const form = document.getElementById("contactForm");
    const inputs = form.querySelectorAll("input, textarea");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        inputs.forEach(function(input) {
            if (input.checkValidity()) {
                input.classList.add("is-valid");
                input.classList.remove("is-invalid");
            } else {
                input.classList.add("is-invalid");
                input.classList.remove("is-valid");
            }
        });

        if (form.checkValidity()) {
            document.getElementById("result").textContent = "Form submitted successfully!";
        } else {
            document.getElementById("result").textContent = "";
        }
    });
</script>

</body>
</html>
