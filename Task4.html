<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5 mb-5">
    <h2 class="mb-4">Registration Form</h2>

    <form id="registrationForm" novalidate>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Enter your first name.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Enter your last name.</div>
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="example@gmail.com" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Enter a valid email.</div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" minlength="6" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Password must have at least 6 characters.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" required>
                <div class="valid-feedback">Passwords match!</div>
                <div class="invalid-feedback">Passwords must match.</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Gender</label>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                <label class="form-check-label" for="male">Male</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                <label class="form-check-label" for="female">Female</label>
            </div>

            <div id="genderFeedback" class="text-danger small d-none">Select your gender.</div>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Hobbies</label>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="sports" value="sports">
                <label class="form-check-label" for="sports">Sports</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="music" value="music">
                <label class="form-check-label" for="music">Music</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="reading" value="reading">
                <label class="form-check-label" for="reading">Reading</label>
            </div>
        </div>

        <div class="mb-3">
            <label for="country" class="form-label">Country</label>
            <select class="form-select" id="country" required>
                <option value="">Choose country</option>
                <option value="Kazakhstan">Kazakhstan</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Germany">Germany</option>
                <option value="Turkey">Turkey</option>
            </select>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please choose a country.</div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>

        <p id="result" class="mt-3 text-success"></p>
    </form>
</div>

<script>
    const form = document.getElementById("registrationForm");
    const fields = form.querySelectorAll(".form-control, .form-select");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        confirmPassword.setCustomValidity(
            confirmPassword.value !== password.value
                ? "Passwords do not match"
                : ""
        );

        fields.forEach(function(field) {
            if (field.checkValidity()) {
                field.classList.add("is-valid");
                field.classList.remove("is-invalid");
            } else {
                field.classList.add("is-invalid");
                field.classList.remove("is-valid");
            }
        });

        const genderSelected = form.querySelector('input[name="gender"]:checked');
        const genderFeedback = document.getElementById("genderFeedback");

        genderFeedback.classList.toggle("d-none", genderSelected !== null);

        if (form.checkValidity() && genderSelected) {
            result.textContent = "Registration successful!";
        } else {
            result.textContent = "";
        }
    });

    form.addEventListener("reset", function() {
        fields.forEach(function(field) {
            field.classList.remove("is-valid", "is-invalid");
        });

        confirmPassword.setCustomValidity("");
        document.getElementById("genderFeedback").classList.add("d-none");
        result.textContent = "";
    });
</script>

</body>
</html>
